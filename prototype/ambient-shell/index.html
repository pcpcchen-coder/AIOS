<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Nous</title>
    <link rel="icon" href="data:," />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body data-mode="ambient">
    <canvas id="brain" aria-hidden="true"></canvas>

    <p id="region-activity" class="region-activity" role="status" aria-live="polite" hidden></p>

    <p id="status-line" class="status-line" hidden></p>

    <div id="caption" class="caption" aria-live="polite" hidden></div>

    <form id="command" class="command" autocomplete="off" hidden>
      <div class="command-bar">
        <span id="mic-indicator" class="mic-indicator" hidden data-i18n="● 收音中">● 收音中</span>
        <input
          id="command-input"
          class="command-input"
          type="text"
          maxlength="2000"
          placeholder="直接跟 ChatGPT 說話，或輸入訊息" data-i18n-placeholder="直接跟 ChatGPT 說話，或輸入訊息"
          aria-label="輸入對話訊息或指令" data-i18n-aria-label="輸入對話訊息或指令"
          enterkeyhint="send"
        />
        <button id="mic" class="icon-btn" type="button" aria-label="按下開始說話" data-i18n-aria-label="按下開始說話" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z"/>
          </svg>
        </button>
        <button id="voice-mode" class="icon-btn" type="button" aria-label="開啟語音對話模式" data-i18n-aria-label="開啟語音對話模式" title="語音對話模式" data-i18n-title="語音對話模式" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M3 10h2v4H3zm4-3h2v10H7zm4-4h2v18h-2zm4 4h2v10h-2zm4 3h2v4h-2z"/>
          </svg>
        </button>
        <button class="icon-btn icon-btn--send" type="submit" aria-label="送出" data-i18n-aria-label="送出">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/>
          </svg>
        </button>
      </div>
      <div id="voice-consent" class="voice-consent" hidden>
        <p id="voice-consent-text"></p>
        <div class="voice-consent-actions">
          <button id="consent-yes" class="btn btn--primary" type="button" data-i18n="啟用語音">啟用語音</button>
          <button id="consent-no" class="btn btn--ghost" type="button" data-i18n="不要">不要</button>
        </div>
      </div>
      <p id="command-error" class="command-error" role="alert" hidden></p>
      <p id="engine-line" class="engine-line" hidden></p>
      <p class="command-hint" data-i18n="Enter 送出 · Esc 關閉 · 可說「進度如何」「看結果」「停止任務」「收起」「開啟語音模式」「設定」">Enter 送出 · Esc 關閉 · 可說「進度如何」「看結果」「停止任務」「收起」「開啟語音模式」「設定」</p>
    </form>

    <div id="surface-root" class="surface-root"></div>

    <button id="voice-pill" class="voice-pill" type="button" hidden></button>
    <p id="subtitle" class="subtitle" aria-live="polite" hidden></p>

    <p id="conversation-status" class="conversation-status" role="status" hidden></p>
    <section id="conversation-reply" class="conversation-reply" aria-label="本次對話" data-i18n-aria-label="本次對話" hidden>
      <p id="conversation-user" class="conversation-user"></p>
      <p id="conversation-answer" class="conversation-answer" aria-live="polite"></p>
      <div class="conversation-actions">
        <button id="conversation-type" class="btn btn--ghost" type="button" data-i18n="打字接著聊">打字接著聊</button>
        <button id="conversation-settings" class="btn btn--ghost" type="button" data-i18n="設定">設定</button>
        <button id="conversation-close" class="btn btn--ghost" type="button" data-i18n="結束對話">結束對話</button>
      </div>
    </section>
    <button id="start-conversation" class="start-conversation" type="button" data-i18n="開始語音對話">開始語音對話</button>

    <p id="first-hint" class="first-hint" data-i18n="點電子腦開始 ChatGPT 語音對話 · 按空白鍵或直接打字也能聊">點電子腦開始 ChatGPT 語音對話 · 按空白鍵或直接打字也能聊</p>
  </body>
</html>
