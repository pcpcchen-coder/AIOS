<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Nous</title>
    <link rel="icon" href="data:," />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body data-mode="ambient">
    <canvas id="brain" aria-hidden="true"></canvas>

    <p id="status-line" class="status-line" hidden></p>

    <div id="caption" class="caption" aria-live="polite" hidden></div>

    <form id="command" class="command" autocomplete="off" hidden>
      <div class="command-bar">
        <span id="mic-indicator" class="mic-indicator" hidden>● 收音中</span>
        <input
          id="command-input"
          class="command-input"
          type="text"
          maxlength="2000"
          placeholder="交辦一件事，或問「進度如何」"
          aria-label="交辦任務或輸入指令"
          enterkeyhint="send"
        />
        <button id="mic" class="icon-btn" type="button" aria-label="按下開始說話" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z"/>
          </svg>
        </button>
        <button id="voice-mode" class="icon-btn" type="button" aria-label="開啟語音對話模式" title="語音對話模式" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M3 10h2v4H3zm4-3h2v10H7zm4-4h2v18h-2zm4 4h2v10h-2zm4 3h2v4h-2z"/>
          </svg>
        </button>
        <button class="icon-btn icon-btn--send" type="submit" aria-label="送出">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/>
          </svg>
        </button>
      </div>
      <div id="voice-consent" class="voice-consent" hidden>
        <p id="voice-consent-text"></p>
        <div class="voice-consent-actions">
          <button id="consent-yes" class="btn btn--primary" type="button">啟用語音</button>
          <button id="consent-no" class="btn btn--ghost" type="button">不要</button>
        </div>
      </div>
      <p id="command-error" class="command-error" role="alert" hidden></p>
      <p id="engine-line" class="engine-line" hidden></p>
      <p class="command-hint">Enter 送出 · Esc 關閉 · 可說「進度如何」「看結果」「停止任務」「收起」「開啟語音模式」「設定」</p>
    </form>

    <div id="surface-root" class="surface-root"></div>

    <button id="voice-pill" class="voice-pill" type="button" hidden></button>
    <p id="subtitle" class="subtitle" aria-live="polite" hidden></p>

    <p id="first-hint" class="first-hint">點一下電子腦、按空白鍵，或直接開始打字交辦任務</p>
  </body>
</html>
