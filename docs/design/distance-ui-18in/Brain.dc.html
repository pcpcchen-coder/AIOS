<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":640,"min":80,"max":1000},"tone":{"editor":"color","default":"#4FD1FF","options":["#4FD1FF","#8B9CFF","#FFB547","#FF6B6B"]},"mode":{"editor":"enum","default":"breath","options":["faint","breath","arc","pulse","dashed","solid","broken","none"]},"progress":{"editor":"range","default":40,"min":0,"max":100,"step":1},"region":{"editor":"enum","default":"none","options":["none","plan","art","math","vision","audio","lang"]},"dim":{"editor":"enum","default":"no","options":["no","yes"]},"$preview":{"width":640,"height":640}}'>
class Component extends DCLogic {
renderVals() {
const size = Number(this.props.size ?? 640);
const tone = this.props.tone ?? '#4FD1FF';
const m = this.props.mode ?? 'breath';
const p = Math.max(0, Math.min(100, Number(this.props.progress ?? 40)));
const dim = (this.props.dim ?? 'no') === 'yes';
const C = 2 * Math.PI * 240;
const spots = { plan: [85, 120], art: [160, 70], math: [262, 100], vision: [335, 180], audio: [228, 215], lang: [118, 205] };
const spot = spots[this.props.region ?? 'none'];
const names = { faint: '待機', breath: '在聽', arc: '處理中', pulse: '說明中', dashed: '等你決定', solid: '請確認', broken: '沒做完', none: '' };
return {
px: size + 'px',
tone: tone,
label: '電子腦狀態：' + (names[m] || ''),
gx: spot ? spot[0] : 200,
gy: spot ? spot[1] : 150,
g1: spot ? 0.12 : 0,
g2: spot ? 0.2 : 0,
g3: spot ? 0.38 : 0,
edgeOp: dim ? 0.4 : 0.75,
nodeOp: dim ? 0.55 : 0.95,
faint: m === 'faint' ? 0.22 : 0,
solid: (m === 'breath' || m === 'pulse' || m === 'solid') ? 0.95 : 0,
solidW: m === 'solid' ? 18 : 10,
inner: m === 'breath' ? 0.35 : 0,
pulse2: m === 'pulse' ? 0.5 : 0,
pulse3: m === 'pulse' ? 0.22 : 0,
track: m === 'arc' ? 0.16 : 0,
arc: m === 'arc' ? 1 : 0,
arcDash: (C * p / 100).toFixed(1) + ' ' + C.toFixed(1),
dashed: m === 'dashed' ? 0.95 : 0,
broken: m === 'broken' ? 0.9 : 0,
brokenDash: (C * 0.78).toFixed(1) + ' ' + (C * 0.22).toFixed(1)
};
}
}
</script>
